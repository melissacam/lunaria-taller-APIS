<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El taller · Lunaria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet" />
  </head>
  <body class="font-sans antialiased">
    <div id="navbar"></div>

    <main class="mx-auto max-w-6xl px-5 pb-28 pt-12">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 class="font-display text-5xl font-bold">El <em class="font-medium text-brasa">taller</em></h1>
          <p id="via" class="mt-3 text-sm opacity-70"></p>
        </div>
        <button id="nueva" class="rounded-full bg-ciruela px-6 py-3 font-medium text-crema transition hover:bg-ciruela/85">+ Nueva vela</button>
      </div>

      <p id="estado" class="mt-8 text-sm opacity-60" aria-live="polite"></p>

      <div class="mt-4 overflow-x-auto rounded-[2.5rem_1rem_2.5rem_1rem] bg-white/70 p-6 shadow-[0_18px_40px_-24px_rgba(74,63,92,.45)]">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-ciruela/20 text-left">
              <th class="w-10 pb-3"></th>
              <th class="pb-3">Nombre</th>
              <th class="hidden pb-3 sm:table-cell">Ánimo</th>
              <th class="pb-3 text-right">Precio</th>
              <th class="pb-3 text-right">Stock</th>
              <th class="pb-3"></th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </main>

    <dialog id="dlg" class="m-auto max-h-[92vh] w-[min(94vw,40rem)] overflow-y-auto rounded-[2.5rem_1rem_2.5rem_1rem] bg-crema p-0 text-ciruela backdrop:bg-ciruela/30 backdrop:backdrop-blur-sm"></dialog>

    <script type="module" src="/src/pages/admin.js"></script>
  </body>
</html>
